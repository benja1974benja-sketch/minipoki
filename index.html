<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GameZone - Juegos</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080d1b;
    color:white;
    min-height:100vh;
}

header{
    background:
        radial-gradient(circle at top right,#8b5cf6,transparent 35%),
        linear-gradient(135deg,#111827,#172554);
    padding:30px 20px;
    border-bottom:1px solid #334155;
}

.header{
    max-width:1250px;
    margin:auto;
}

.logo{
    font-size:36px;
    font-weight:900;
}

.logo span{
    color:#facc15;
}

.subtitle{
    color:#cbd5e1;
    margin:8px 0 20px;
}

.search{
    width:100%;
    max-width:650px;
    padding:15px 18px;
    border-radius:12px;
    border:1px solid #475569;
    background:#0f172a;
    color:white;
    font-size:16px;
    outline:none;
}

nav{
    max-width:1250px;
    margin:18px auto;
    padding:0 15px;
    display:flex;
    gap:10px;
    overflow:auto;
}

.category{
    border:0;
    border-radius:20px;
    padding:11px 18px;
    color:white;
    background:#1e293b;
    cursor:pointer;
    white-space:nowrap;
}

.category:hover,
.category.active{
    background:#7c3aed;
}

main{
    max-width:1250px;
    margin:auto;
    padding:0 15px 50px;
}

.featured{
    background:
        linear-gradient(135deg,rgba(124,58,237,.9),rgba(14,165,233,.75)),
        #172554;
    border-radius:20px;
    padding:25px;
    margin:20px 0 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    cursor:pointer;
    border:1px solid #6366f1;
}

.featured h1{
    font-size:32px;
    margin-bottom:10px;
}

.featured p{
    color:#e2e8f0;
    max-width:600px;
}

.play-featured{
    background:#facc15;
    color:#111827;
    border:0;
    border-radius:12px;
    padding:15px 25px;
    font-weight:bold;
    font-size:17px;
    cursor:pointer;
}

.section-title{
    margin:25px 0 18px;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:18px;
}

.card{
    position:relative;
    overflow:hidden;
    background:#111827;
    border:1px solid #273449;
    border-radius:16px;
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    transform:translateY(-6px);
    border-color:#6366f1;
    box-shadow:0 15px 35px rgba(0,0,0,.4);
}

.cover{
    height:145px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:65px;
}

.info{
    padding:14px;
}

.info h3{
    font-size:18px;
}

.info p{
    color:#94a3b8;
    margin-top:5px;
    font-size:13px;
}

.favorite{
    position:absolute;
    top:10px;
    right:10px;
    z-index:5;
    width:35px;
    height:35px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.6);
    color:white;
    cursor:pointer;
    font-size:19px;
}

.favorite.active{
    color:#ef4444;
}

.empty{
    padding:50px;
    text-align:center;
    color:#94a3b8;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    z-index:1000;
    inset:0;
    background:rgba(0,0,0,.88);
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.open{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:1000px;
    max-height:96vh;
    overflow:auto;
    background:#0f172a;
    border:1px solid #334155;
    border-radius:20px;
    padding:20px;
    position:relative;
}

.close{
    position:absolute;
    top:12px;
    right:12px;
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#ef4444;
    color:white;
    font-size:24px;
    cursor:pointer;
    z-index:20;
}

#gameTitle{
    margin-bottom:15px;
}

.game-area{
    min-height:450px;
    background:#020617;
    border-radius:15px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:hidden;
}

.game-button{
    border:0;
    background:#7c3aed;
    color:white;
    border-radius:10px;
    padding:12px 20px;
    cursor:pointer;
    font-weight:bold;
    font-size:16px;
    margin:5px;
}

.game-button:hover{
    background:#8b5cf6;
}

canvas{
    max-width:100%;
    border-radius:10px;
    background:#020617;
}

.score{
    font-size:20px;
    margin-bottom:10px;
}

.controls{
    color:#94a3b8;
    margin-top:10px;
    text-align:center;
}

/* 2048 */

.board2048{
    width:320px;
    height:320px;
    padding:8px;
    background:#475569;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    border-radius:10px;
}

.tile2048{
    background:#334155;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
    border-radius:6px;
}

/* TTT */

.ttt{
    display:grid;
    grid-template-columns:repeat(3,90px);
    gap:7px;
}

.ttt button{
    width:90px;
    height:90px;
    border:0;
    border-radius:8px;
    background:#334155;
    color:white;
    font-size:35px;
}

/* CONNECT 4 */

.connect4{
    display:grid;
    grid-template-columns:repeat(7,50px);
    gap:5px;
    background:#2563eb;
    padding:10px;
    border-radius:10px;
}

.connect4 button{
    width:50px;
    height:50px;
    border-radius:50%;
    border:0;
    background:#e2e8f0;
}

/* ROOFTOP */

.rooftop-wrap{
    width:100%;
    text-align:center;
}

.rooftop-wrap canvas{
    width:100%;
    max-width:900px;
}

.rooftop-info{
    display:flex;
    justify-content:space-between;
    max-width:900px;
    margin:8px auto;
}

footer{
    text-align:center;
    color:#64748b;
    padding:30px;
}

@media(max-width:700px){

    .logo{
        font-size:28px;
    }

    .featured{
        flex-direction:column;
        align-items:flex-start;
    }

    .games{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .cover{
        height:110px;
        font-size:50px;
    }

    .info h3{
        font-size:15px;
    }

    .game-area{
        min-height:400px;
        padding:10px;
    }
}
</style>
</head>

<body>

<header>
<div class="header">

    <div class="logo">
        🎮 Game<span>Zone</span>
    </div>

    <div class="subtitle">
        Juegos clásicos y nuevos desafíos directamente en tu navegador.
    </div>

    <input
        id="search"
        class="search"
        placeholder="🔎 Buscar un juego..."
    >

</div>
</header>

<nav>

<button class="category active" data-cat="Todos">
Todos
</button>

<button class="category" data-cat="Arcade">
🕹️ Arcade
</button>

<button class="category" data-cat="Puzzle">
🧩 Puzzle
</button>

<button class="category" data-cat="Deportes">
🏆 Deportes
</button>

<button class="category" data-cat="Accion">
🔥 Acción
</button>

<button class="category" data-cat="Favoritos">
❤️ Favoritos
</button>

</nav>

<main>

<div class="featured" id="featured">

<div>
<h1>🔫 Rooftop Rumble</h1>

<p>
Duelo sobre los tejados. Salta, muévete, esquiva
y dispara para conseguir puntos.
</p>
</div>

<button class="play-featured">
JUGAR AHORA
</button>

</div>

<h2 class="section-title">
🎮 Todos los juegos
</h2>

<div id="games" class="games"></div>

</main>

<footer>
GameZone © 2026
</footer>


<div class="modal" id="modal">

<div class="modal-box">

<button class="close" id="close">
×
</button>

<h2 id="gameTitle"></h2>

<div id="gameArea" class="game-area"></div>

</div>

</div>


<script>

/* =====================================================
   LISTA DE JUEGOS
===================================================== */

const games=[

{
id:"rooftop",
name:"Rooftop Rumble",
cat:"Accion",
icon:"🔫",
color:"linear-gradient(135deg,#7c3aed,#0ea5e9)"
},

{
id:"snake",
name:"Snake",
cat:"Arcade",
icon:"🐍",
color:"linear-gradient(135deg,#22c55e,#166534)"
},

{
id:"tetris",
name:"Tetris",
cat:"Puzzle",
icon:"🧱",
color:"linear-gradient(135deg,#06b6d4,#2563eb)"
},

{
id:"pong",
name:"Pong",
cat:"Arcade",
icon:"🏓",
color:"linear-gradient(135deg,#6366f1,#312e81)"
},

{
id:"dino",
name:"Dino Runner",
cat:"Arcade",
icon:"🦖",
color:"linear-gradient(135deg,#64748b,#1e293b)"
},

{
id:"2048",
name:"2048",
cat:"Puzzle",
icon:"🟦",
color:"linear-gradient(135deg,#f59e0b,#d97706)"
},

{
id:"ttt",
name:"Tres en Raya",
cat:"Puzzle",
icon:"❌",
color:"linear-gradient(135deg,#3b82f6,#7c3aed)"
},

{
id:"mines",
name:"Buscaminas",
cat:"Puzzle",
icon:"💣",
color:"linear-gradient(135deg,#64748b,#0f172a)"
},

{
id:"breakout",
name:"Arkanoid",
cat:"Arcade",
icon:"🧱",
color:"linear-gradient(135deg,#ec4899,#be185d)"
},

{
id:"pac",
name:"Pac-Man",
cat:"Arcade",
icon:"👻",
color:"linear-gradient(135deg,#facc15,#ea580c)"
},

{
id:"invaders",
name:"Space Invaders",
cat:"Accion",
icon:"👾",
color:"linear-gradient(135deg,#312e81,#111827)"
},

{
id:"flappy",
name:"Flappy",
cat:"Arcade",
icon:"🐦",
color:"linear-gradient(135deg,#38bdf8,#2563eb)"
},

{
id:"connect",
name:"Conecta 4",
cat:"Puzzle",
icon:"🔴",
color:"linear-gradient(135deg,#2563eb,#1d4ed8)"
},

{
id:"sudoku",
name:"Sudoku",
cat:"Puzzle",
icon:"🔢",
color:"linear-gradient(135deg,#8b5cf6,#4c1d95)"
},

{
id:"chess",
name:"Ajedrez",
cat:"Puzzle",
icon:"♟️",
color:"linear-gradient(135deg,#78716c,#292524)"
}

];


/* =====================================================
   VARIABLES
===================================================== */

const container=
document.getElementById("games");

const search=
document.getElementById("search");

const modal=
document.getElementById("modal");

const gameArea=
document.getElementById("gameArea");

const gameTitle=
document.getElementById("gameTitle");

let category="Todos";

let favorites=
JSON.parse(
localStorage.getItem("favorites")||"[]"
);

let cleanup=null;


/* =====================================================
   FAVORITOS
===================================================== */

function favorite(id){

if(favorites.includes(id)){

favorites=
favorites.filter(x=>x!==id);

}else{

favorites.push(id);

}

localStorage.setItem(
"favorites",
JSON.stringify(favorites)
);

render();

}


/* =====================================================
   RENDER
===================================================== */

function render(){

let text=
search.value.toLowerCase();

let list=
games.filter(game=>{

let catOK=
category==="Todos"||
(
category==="Favoritos"
?
favorites.includes(game.id)
:
game.cat===category
);

let searchOK=
game.name.toLowerCase().includes(text);

return catOK&&searchOK;

});


container.innerHTML="";


if(!list.length){

container.innerHTML=
`<div class="empty">
<h2>No hay juegos</h2>
<p>Prueba otra búsqueda.</p>
</div>`;

return;

}


list.forEach(game=>{

let card=
document.createElement("div");

card.className="card";

card.innerHTML=`

<button class="favorite ${
favorites.includes(game.id)?"active":""
}">
${favorites.includes(game.id)?"♥":"♡"}
</button>

<div class="cover"
style="background:${game.color}">
${game.icon}
</div>

<div class="info">
<h3>${game.name}</h3>
<p>${game.cat}</p>
</div>

`;

card.onclick=()=>openGame(game.id);

card
.querySelector(".favorite")
.onclick=e=>{

e.stopPropagation();

favorite(game.id);

};

container.appendChild(card);

});

}


document
.querySelectorAll(".category")
.forEach(button=>{

button.onclick=()=>{

document
.querySelectorAll(".category")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

category=
button.dataset.cat;

render();

};

});


search.oninput=render;


/* =====================================================
   MODAL
===================================================== */

function openGame(id){

if(cleanup){
cleanup();
cleanup=null;
}

const game=
games.find(x=>x.id===id);

gameTitle.textContent=
game.icon+" "+game.name;

gameArea.innerHTML="";

modal.classList.add("open");

startGame(id);

}


function closeGame(){

if(cleanup){
cleanup();
cleanup=null;
}

modal.classList.remove("open");

gameArea.innerHTML="";

}


document
.getElementById("close")
.onclick=closeGame;

modal.onclick=e=>{

if(e.target===modal)
closeGame();

};


document
.getElementById("featured")
.onclick=()=>openGame("rooftop");


/* =====================================================
   SELECTOR
===================================================== */

function startGame(id){

const list={

rooftop:rooftop,
snake:snake,
tetris:tetris,
pong:pong,
dino:dino,
"2048":game2048,
ttt:ttt,
mines:mines,
breakout:breakout,
pac:pacman,
invaders:invaders,
flappy:flappy,
connect:connect4,
sudoku:sudoku,
chess:chess

};

if(list[id])
cleanup=list[id]();

}


/* =====================================================
   ROOFTOP RUMBLE
===================================================== */

function rooftop(){

gameArea.innerHTML=`

<div class="rooftop-wrap">

<canvas
id="roofCanvas"
width="900"
height="500">
</canvas>

<div class="rooftop-info">

<span>
🔵 Jugador: <b id="pScore">0</b>
</span>

<span>
🔴 Rival: <b id="eScore">0</b>
</span>

</div>

<p class="controls">
A / D = moverse · W = saltar · ESPACIO = disparar
</p>

</div>
`;


const canvas=
document.getElementById("roofCanvas");

const ctx=
canvas.getContext("2d");


let player={
x:150,
y:350,
vx:0,
vy:0,
w:35,
h:50,
ground:false
};

let enemy={
x:710,
y:350,
vx:0,
vy:0,
w:35,
h:50,
ground:false
};


let bullets=[];

let keys={};

let pScore=0;
let eScore=0;

let animation;

const gravity=.6;


/* plataformas */

const platforms=[

{x:0,y:430,w:900,h:70},

{x:100,y:330,w:220,h:20},

{x:580,y:330,w:220,h:20},

{x:370,y:250,w:160,h:20},

{x:20,y:180,w:160,h:20},

{x:720,y:180,w:160,h:20}

];


function collision(a,b){

return(
a.x<b.x+b.w &&
a.x+a.w>b.x &&
a.y<b.y+b.h &&
a.y+a.h>b.y
);

}


function reset(){

player.x=150;
player.y=350;
player.vx=0;
player.vy=0;

enemy.x=710;
enemy.y=350;
enemy.vx=0;
enemy.vy=0;

bullets=[];

}


function shoot(owner){

let obj=
owner==="player"?player:enemy;

let direction=
owner==="player"?1:-1;

bullets.push({

x:obj.x+obj.w/2,
y:obj.y+20,
vx:direction*9,
owner:owner

});

}


function updatePlayer(){

player.vx=0;

if(keys.a)
player.vx=-4;

if(keys.d)
player.vx=4;

if(
keys.w &&
player.ground
){

player.vy=-11;
player.ground=false;

}


player.vy+=gravity;

player.x+=player.vx;

player.y+=player.vy;

player.ground=false;


platforms.forEach(platform=>{

if(
player.x+player.w>platform.x &&
player.x<platform.x+platform.w &&
player.y+player.h>platform.y &&
player.y+player.h<platform.y+25 &&
player.vy>=0
){

player.y=
platform.y-player.h;

player.vy=0;

player.ground=true;

}

});


player.x=
Math.max(
0,
Math.min(
865,
player.x
)
);

}


function updateEnemy(){

let target=
player.x<enemy.x?-1:1;

enemy.vx=
target*2.2;

if(
Math.abs(player.x-enemy.x)<350 &&
Math.random()<.02
){

shoot("enemy");

}


if(
player.y<enemy.y-60 &&
enemy.ground
){

enemy.vy=-10;

}


enemy.vy+=gravity;

enemy.x+=enemy.vx;

enemy.y+=enemy.vy;

enemy.ground=false;


platforms.forEach(platform=>{

if(
enemy.x+enemy.w>platform.x &&
enemy.x<platform.x+platform.w &&
enemy.y+enemy.h>platform.y &&
enemy.y+enemy.h<platform.y+25 &&
enemy.vy>=0
){

enemy.y=
platform.y-enemy.h;

enemy.vy=0;

enemy.ground=true;

}

});


enemy.x=
Math.max(
0,
Math.min(
865,
enemy.x
)
);

}


function updateBullets(){

bullets.forEach(b=>{

b.x+=b.vx;

const target=
b.owner==="player"
?enemy
:player;

if(
b.x>target.x &&
b.x<target.x+target.w &&
b.y>target.y &&
b.y<target.y+target.h
){

if(b.owner==="player"){

pScore++;

}else{

eScore++;

}

document.getElementById(
"pScore"
).textContent=pScore;

document.getElementById(
"eScore"
).textContent=eScore;

reset();

}


});


bullets=
bullets.filter(
b=>b.x>-20&&b.x<920
);

}


function draw(){

ctx.fillStyle="#111827";

ctx.fillRect(
0,
0,
900,
500
);


/* cielo */

ctx.fillStyle="#1e3a8a";

ctx.fillRect(
0,
0,
900,
430
);


/* luna */

ctx.fillStyle="#f8fafc";

ctx.beginPath();

ctx.arc(
780,
80,
35,
0,
Math.PI*2
);

ctx.fill();


/* edificios */

ctx.fillStyle="#0f172a";

ctx.fillRect(0,390,80,40);

ctx.fillRect(250,380,100,50);

ctx.fillRect(540,370,100,60);

ctx.fillRect(830,350,70,80);


/* plataformas */

platforms.forEach(p=>{

ctx.fillStyle="#334155";

ctx.fillRect(
p.x,
p.y,
p.w,
p.h
);

ctx.fillStyle="#64748b";

ctx.fillRect(
p.x,
p.y,
p.w,
5
);

});


/* jugador */

ctx.fillStyle="#38bdf8";

ctx.fillRect(
player.x,
player.y,
player.w,
player.h
);


/* rival */

ctx.fillStyle="#ef4444";

ctx.fillRect(
enemy.x,
enemy.y,
enemy.w,
enemy.h
);


/* armas */

ctx.fillStyle="#facc15";

ctx.fillRect(
player.x+30,
player.y+20,
18,
6
);

ctx.fillRect(
enemy.x-15,
enemy.y+20,
18,
6
);


/* balas */

bullets.forEach(b=>{

ctx.fillStyle="#facc15";

ctx.beginPath();

ctx.arc(
b.x,
b.y,
5,
0,
Math.PI*2
);

ctx.fill();

});


/* texto */

ctx.fillStyle="white";

ctx.font="bold 20px Arial";

ctx.fillText(
"ROOFTOP RUMBLE",
20,
35
);

}


function loop(){

updatePlayer();

updateEnemy();

updateBullets();

draw();

animation=
requestAnimationFrame(loop);

}


function keydown(e){

if(e.key.toLowerCase()==="a")
keys.a=true;

if(e.key.toLowerCase()==="d")
keys.d=true;

if(e.key.toLowerCase()==="w")
keys.w=true;

if(e.code==="Space"){

e.preventDefault();

shoot("player");

}

}


function keyup(e){

if(e.key.toLowerCase()==="a")
keys.a=false;

if(e.key.toLowerCase()==="d")
keys.d=false;

if(e.key.toLowerCase()==="w")
keys.w=false;

}


document.addEventListener(
"keydown",
keydown
);

document.addEventListener(
"keyup",
keyup
);

loop();


return()=>{

cancelAnimationFrame(animation);

document.removeEventListener(
"keydown",
keydown
);

document.removeEventListener(
"keyup",
keyup
);

};

}


/* =====================================================
   SNAKE
===================================================== */

function snake(){

gameArea.innerHTML=`

<canvas
id="snake"
width="400"
height="400">
</canvas>

<p class="controls">
Usa las flechas.
</p>
`;

const canvas=
document.getElementById("snake");

const ctx=
canvas.getContext("2d");

let body=[
{x:200,y:200},
{x:180,y:200},
{x:160,y:200}
];

let food={
x:300,
y:200
};

let dx=20;

18,
18
)
);

food.x,
food.y,
18,
18
);

function move(){

y:body[0].y+dy
};

head.x<0||
head.x>=400||
head.y<0||
head.y>=400||
body.some(
p=>p.x===head.x&&p.y===head.y
)
){

alert("Game Over");

){

};

dy=20;

dx=-20;
dy=0;

dx=20;
dy=0;

document.getElementById("tetris");

canvas.getContext("2d");

const cols=10;
const rows=16;
const size=30;

Array.from(
{length:rows},
()=>Array(cols).fill(0)
);

x:4,
y:0,
color:"#22d3ee"
};

let timer;
let animation;


function draw(){

ctx.fillStyle="#020617";

ctx.fillRect(
0,0,300,500
);

board.forEach((row,y)=>{

row.forEach((cell,x)=>{

if(cell){

ctx.fillStyle=cell;

ctx.fillRect(
x*size,
y*size,
size-2,
size-2
);

}

});

});


ctx.fillStyle=piece.color;

ctx.fillRect(
piece.x*size,
piece.y*size,
size-2,
size-2
);

}


function drop(){

piece.y++;

if(piece.y>=rows){

piece.y=0;

piece.x=
Math.floor(
Math.random()*cols
);

piece.color=
[
"#22d3ee",
"#a855f7",

][

];

piece.x=Math.max(0,piece.x-1);

if(e.key==="ArrowRight")
piece.x=Math.min(cols-1,piece.x+1);

drop();

if(e.code==="Space"){

piece.color=
"#"+Math.floor(
Math.random()*16777215
).toString(16);

}

"keydown",
key
);

/* =====================================================
   2048
===================================================== */

function game2048(){

gameArea.innerHTML=`

<div class="score">
Puntos: <span id="score2048">0</span>
</div>

<div
id="board2048"
class="board2048">
</div>

<p class="controls">
Usa las flechas.
</p>
`;

let board=
Array(16).fill(0);

let score=0;


function addTile(){

let empty=
board
.map((x,i)=>x?null:i)
.filter(x=>x!==null);

if(!empty.length)return;

let index=
empty[
Math.floor(
Math.random()*empty.length
)
];

board[index]=2;

}


addTile();
addTile();


function draw(){

const container=
document.getElementById(
"board2048"
);

container.innerHTML="";

board.forEach(value=>{

let div=
document.createElement("div");

div.className="tile2048";

div.textContent=
value||"";

container.appendChild(div);

});

document.getElementById(
"score2048"
).textContent=score;

}


function move(direction){

let old=
JSON.stringify(board);

let rows=[];

for(let i=0;i<4;i++){

rows.push(
board.slice(i*4,i*4+4)
);

}


function process(row){

if(direction==="right")
row.reverse();

let values=
row.filter(x=>x);

for(let i=0;i<values.length-1;i++){

if(values[i]===values[i+1]){

values[i]*=2;

score+=values[i];

values.splice(i+1,1);

}

}

while(values.length<4)
values.push(0);

if(direction==="right")
values.reverse();

return values;

}


if(direction==="left"||
direction==="right"){

rows=
rows.map(
row=>process(row)
);

}else{

let columns=[];

for(let x=0;x<4;x++){

let col=[];

for(let y=0;y<4;y++)
col.push(
board[y*4+x]
);

columns.push(col);

}

columns=
columns.map(
col=>process(
direction==="down"
?
col.reverse()
:
col
)
);

board=
Array(16).fill(0);

for(let x=0;x<4;x++){

for(let y=0;y<4;y++){

board[y*4+x]=columns[x][y];

}

}

}


if(direction==="left"||
direction==="right"){

board=rows.flat();

}


if(
JSON.stringify(board)!==old
){

addTile();

}

draw();

}


function key(e){

const map={

ArrowLeft:"left",
ArrowRight:"right",
ArrowUp:"up",
ArrowDown:"down"

};

if(map[e.key]){

e.preventDefault();

move(map[e.key]);

}

}


document.addEventListener(
"keydown",
key
);

draw();


return()=>{

document.removeEventListener(
"keydown",
key
);

};

}

function ttt(){

gameArea.innerHTML=`

<div
class="ttt"
id="ttt">

id="tttText"
class="controls">
Tu turno ❌
</p>

<button
id="tttReset"
class="game-button">
Reiniciar
</button>
`;

let board=
Array(9).fill("");

let over=false;


function render(){

const div=
document.getElementById("ttt");

div.innerHTML="";

board.forEach(
(value,index)=>{

let b=
document.createElement("button");

b.textContent=value;

b.onclick=()=>play(index);

div.appendChild(b);

});

}


function winner(){

const wins=[
[0,1,2],
[3,4,5],
[6,7,8],
[0,3,6],
[1,4,7],
[2,5,8],
[0,4,8],
[2,4,6]
];

for(
const [a,b,c] of wins
){

if(
board[a] &&
board[a]===board[b] &&
board[a]===board[c]
){

return board[a];

}

}

if(board.every(x=>x))
return"draw";

return null;

}


function play(i){

if(board[i]||over)return;

board[i]="❌";

let result=winner();

if(result){

finish(result);
return;

}


let empty=
board
.map((x,i)=>x?null:i)
.filter(x=>x!==null);

if(empty.length){

let move=
empty[
Math.floor(
Math.random()*empty.length
)
];

board[move]="⭕";

}

result=winner();

if(result){

finish(result);

return;

}

render();

}


function finish(result){

over=true;

render();

document.getElementById(
"tttText"
).textContent=
result==="draw"
?"Empate 🤝":
result==="❌"
?"¡Has ganado! 🏆":
"Ha ganado la máquina 🤖";

}


document.getElementById(
"tttReset"
).onclick=()=>{

board=Array(9).fill("");

over=false;

document.getElementById(
"tttText"
).textContent=
"Tu turno ❌";

render();

};


render();


return()=>{};

}
